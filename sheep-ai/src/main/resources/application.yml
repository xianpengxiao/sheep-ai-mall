spring:
  profiles:
    active: dev
  application:
    name: sheep-ai
  cloud:
    nacos:
      server-addr: 192.168.168.100:8848
      username: nacos
      password: nacos
      discovery:
        group: SHEEP_MALL
      config:
        group: SHEEP_MALL
        file-extension: yaml
        import-check:
          enabled: false

  datasource:
    driver-class-name: ${sheep.datasource.driver-class-name}
    url: jdbc:mysql://${sheep.datasource.host}:${sheep.datasource.port}/${sheep.datasource.database}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${sheep.datasource.username}
    password: ${sheep.datasource.password}

  rabbitmq:
    host: ${sheep.rabbitmq.host}
    port: ${sheep.rabbitmq.port}
    username: ${sheep.rabbitmq.username}
    password: ${sheep.rabbitmq.password}
    virtual-host: ${sheep.rabbitmq.virtual-host}

  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${sheep.ai.deepseek.api-key}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.8
      embedding:
        base-url: https://api.openai.com
        api-key: ${OPENAI_API_KEY:sk-placeholder}
        options:
          model: text-embedding-3-small

mybatis-plus:
  type-aliases-package: com.xs.sheepaimall.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
